<div class=card><h2>Password</h2><label>Current password</label><input id=p0 type=password><label>New password (min 8)</label><input id=p1 type=password><label>Confirm new password</label><input id=p2 type=password><div id=er2 class=err></div><button class=btn data-a=spw>Update password</button></div>
<div class=card><h2>Notifications</h2>${tg('task','Chore reminders')}${tg('exp','Expense updates')}${tg('space','Shared space bookings')}</div>
<div class=card><h2>Appearance & language</h2><label>Language</label><select id=lg><option>English</option><option disabled>العربية (proposed)</option><option disabled>Lietuvių (proposed)</option><option disabled>Türkçe (proposed)</option></select><button class="btn s" style="margin-top:12px" data-a=theme>Switch to ${W.theme=='dark'?'light':'dark'} theme</button></div>
<div class=card><h2>Household</h2><label>Name</label><input id=hn value="${X(s.hh.name)}"><label>Address / city</label><input id=hc value="${X(s.hh.city)}"><div id=er3 class=err></div><button class=btn data-a=shh>Save household</button></div>
<div class=card><h2>Subscription</h2><p>${s.pro?'Casamates Pro (demo preview)':'Free Flat Plan'}</p><p class=m style="margin:6px 0 12px">No payment is processed in this demo.</p><button class="btn s" data-a=nav:price>Manage plan</button></div>
<div class=card><h2>Legal & account</h2><div class=row style="flex-wrap:wrap"><button class="btn s sm" data-a=legal:Privacy>Privacy policy</button><button class="btn s sm" data-a=legal:Terms>Terms of service</button>${W.sess=='demo'?'<button class="btn s sm" data-a=rstd>Reset demo data</button>':''}<button class="btn d sm" data-a=out>Log out</button></div></div></div>`}
A.sprof=()=>{const s=S(),n=$('#sn').value.trim(),e=$('#se').value.trim();if(n.length<2)return er('Enter your name.');if(W.sess=='real'&&!em(e))return er('Enter a valid email address.');M(s.me).n=n;if(W.sess=='real')W.acct={name:n,email:e.toLowerCase()};save();render();toast('Profile saved')};
A.spw=()=>{const p=$('#p1').value,x=m=>$('#er2').textContent=m;if(!$('#p0').value)return x('Enter your current password.');if(p.length<8)return x('New password needs at least 8 characters.');if(p!==$('#p2').value)return x('Passwords do not match.');['p0','p1','p2'].forEach(i=>$('#'+i).value='');x('');toast('Password updated (demo: passwords are not stored)')};
A.shh=()=>{const s=S(),n=$('#hn').value.trim(),c=$('#hc').value.trim();if(!n||!c)return $('#er3').textContent='Name and city are required.';s.hh.name=n;s.hh.city=c;save();render();toast('Household saved')};
A.theme=()=>{W.theme=W.theme=='dark'?'light':'dark';save();render()};
A.legal=k=>mo(`<h2>${k=='Privacy'?'Privacy policy':'Terms of service'}</h2><p class=m>Demo placeholder text. CASAMATES stores demo data only in your browser and sends nothing to a server. A real ${k=='Privacy'?'policy':'agreement'} would be published before launch.</p><button class=btn style="margin-top:14px" data-a=close>Close</button>`);

/* EVENTS */
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t)return;e.preventDefault();const[a,p]=t.dataset.a.split(':');if(A[a])A[a](p,t)});
document.addEventListener('input',e=>{const i=e.target.id||'';if(i[0]=='x'&&$('#pv'))xp();if(i=='pn'){const n=Math.max(1,Math.min(12,+e.target.value||1));$('#pc').textContent=E(n*200)+' / flat / month'}});
document.addEventListener('change',e=>{const i=e.target.id||'';if(i=='sd'&&e.target.value){UI.sd=e.target.value;render()}if(i.startsWith('nt-')){S().n[i.slice(3)]=e.target.checked?1:0;save()}});
function render(){document.documentElement.dataset.theme=W.theme;$('#root').innerHTML=V=='app'&&W.sess&&S()?shell():authv()}
render();
</script></body></html>
